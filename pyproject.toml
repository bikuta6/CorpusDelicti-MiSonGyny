[project]
name = "iberlef-misongyny"
version = "0.1.0"
description = "Detección de misoginia en canciones"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "accelerate>=0.26.0", # Ajustado a una versión estable
    "datasets>=2.14.0",
    "numpy>=1.24.0", # Versión compatible amplia
    "pandas>=2.0.0", # Necesario para MarIA
    "protobuf>=6.33.5",
    "pysentimiento>=0.7.3",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0", # Necesario para mDeBERTa/MarIA
    "sentencepiece>=0.2.1",
    "tiktoken", # Necesario a veces para RoBERTa
    "tokenizers>=0.22.2",
    "torch>=2.4.0", # <--- CAMBIO CRÍTICO: Versión real
    "torchaudio>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.66.0",
    "transformers>=4.36.0", # Versión moderna
]

# --- AQUÍ ESTÁ LA MAGIA PARA LA GPU ---
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
